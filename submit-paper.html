<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Paper - Research Paper Submission System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container nav">
            <a href="author-dashboard.html" class="logo">
                <i class="fas fa-file-invoice"></i> RESEARCH PAPER SYSTEM
            </a>
            <div class="user-profile">
                <span>John Doe</span>
                <i class="fas fa-user-circle fa-lg"></i>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <main class="container mt-4" style="max-width: 800px;">
        <h2 class="mb-4">SUBMIT NEW MANUSCRIPT</h2>

        <div class="card">
            <form style="padding: 2rem;" action="author-dashboard.html">
                <div class="form-group">
                    <label for="title">Paper Title</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter complete title" required>
                </div>

                <div class="form-group">
                    <label for="abstract">Abstract</label>
                    <textarea id="abstract" class="form-control" rows="6"
                        placeholder="Brief summary of research - 250 words max" required></textarea>
                </div>

                <div class="form-group">
                    <label for="keywords">Keywords</label>
                    <input type="text" id="keywords" class="form-control"
                        placeholder="e.g. AI, Machine Learning, Healthcare">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="category" value="Research Article" checked> Research Article
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="category" value="Review Article"> Review Article
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="category" value="Short Communication"> Short Communication
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Manuscript (PDF only, max 10MB)</label>
                    <div class="upload-area" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-file-pdf upload-icon"></i>
                        <p id="file-name-display">Click here to upload your manuscript</p>
                        <input type="file" id="file-input" style="display: none;" accept=".pdf">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2;">SUBMIT PAPER</button>
                    <a href="author-dashboard.html" class="btn btn-outline"
                        style="flex: 1; text-decoration: none; padding-top: 0.8rem;">CANCEL</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
