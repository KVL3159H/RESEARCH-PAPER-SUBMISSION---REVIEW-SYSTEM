<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review - Research Paper System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container nav">
            <a href="reviewer-dashboard.html" class="logo">
                <i class="fas fa-file-invoice"></i> RESEARCH PAPER SYSTEM
            </a>
            <div class="user-profile">
                <span>Dr. Sarah Lee</span>
                <i class="fas fa-user-md fa-lg"></i>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <main class="container mt-4" style="max-width: 900px;">
        <h2 class="mb-4">SUBMIT REVIEW - PAPER #1001</h2>

        <div class="card mb-4">
            <div style="padding: 1.5rem; background: #f1f3f5; border-bottom: 1px solid var(--border-color);">
                <p style="font-weight: 600; color: var(--primary-color);">PAPER DETAILS</p>
                <h3 style="margin: 0.5rem 0;">AI in Healthcare: A Comprehensive Review</h3>
                <p style="color: var(--text-muted);">Author: Dr. John Smith</p>
            </div>

            <form style="padding: 2rem;" action="reviewer-dashboard.html">
                <div class="card mb-4" style="box-shadow: none; border: 1px solid var(--border-color);">
                    <div class="card-header" style="background: #fafafa;">
                        <span style="font-weight: 600;">RECOMMENDATION</span>
                    </div>
                    <div style="padding: 1.5rem;" class="radio-group">
                        <label class="radio-item"><input type="radio" name="recommendation" value="Accept" checked>
                            Accept</label>
                        <label class="radio-item"><input type="radio" name="recommendation" value="Minor Revisions">
                            Minor Revisions</label>
                        <label class="radio-item"><input type="radio" name="recommendation" value="Major Revisions">
                            Major Revisions</label>
                        <label class="radio-item"><input type="radio" name="recommendation" value="Reject">
                            Reject</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="score">Review Score (1-5)</label>
                    <input type="number" id="score" class="form-control" min="1" max="5" value="4"
                        style="width: 100px;">
                </div>

                <div class="form-group">
                    <label for="comments-author">Comments to Author</label>
                    <textarea id="comments-author" class="form-control" rows="5"
                        placeholder="Provide constructive feedback..."></textarea>
                </div>

                <div class="form-group">
                    <label for="comments-editor">Comments to Editor (Confidential)</label>
                    <textarea id="comments-editor" class="form-control" rows="3"
                        placeholder="Private feedback for the editor..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2;">SUBMIT REVIEW</button>
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="window.history.back()">SAVE
                        DRAFT</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
