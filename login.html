<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Research Paper Submission & Review System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <h1>RESEARCH PAPER SYSTEM</h1>
        <p class="subtitle">WELCOME BACK</p>
        
        <form action="author-dashboard.html">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope mr-1"></i> Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock mr-1"></i> Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group mb-4">
                <a href="#" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary mb-4">LOGIN</button>
            
            <p class="text-center" style="font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Create New Account</a>
            </p>
        </form>
    </div>
</body>
</html>
